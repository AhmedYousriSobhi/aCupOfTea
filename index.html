<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts/dist/docsify-plugin-flexible-alerts.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
  <link rel="stylesheet" href="https://unpkg.com/docsify-plugin-toc@1.3.1/dist/light.css">

</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'aCupOfTea',
      repo: 'AhmedYousriSobhi/aCupOfTea',
      // basePath: '../', // Tell docsify to look for the markdown files in the parent directory
      loadSidebar: './.docs/_sidebar.md',
      loadNavbar: './.docs/_navbar.md',
      relativePath: false, // Use relative paths for sidebar and navbar links
      subMaxLevel: 0,
      sidebarDisplayLevel: 0, // 0 = collapse all, 1 = show top level only
      auto2top: true,
      search: 'auto',
       pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      // Configure the tabs plugin
      tabs: {
        persist: true,      // stay on the same tab when refreshing
        sync: true,         // sync tabs with same label across page
        theme: 'classic',   // 'classic' or 'material'
      },
      // CONFIGURE THE RIGHT SIDEBAR (TOC)
      toc: {
        tocMaxLevel: 3,  // How deep to go (h1, h2, h3)
        //scope: '.markdown-section',
        target: 'h1, h2, h3, h4, h5, h6',
        //title: 'On This Page',
      },
      // Add this to help Docsify match URLs to the sidebar entries
      alias: {
        '/(.*)/_sidebar.md': './.docs/_sidebar.md',
        '/(.*)/_navbar.md': './.docs/_navbar.md'
      },
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true });</script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="https://unpkg.com/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>

</body>
</html>
