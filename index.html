<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aCupOfTea: knowledge in short sips</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Notes on AI, machine learning, software engineering and the business around them, short enough to read on a coffee break.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="aCupOfTea: knowledge in short sips">
  <meta property="og:description" content="Notes on AI, machine learning, software engineering and the business around them, short enough to read on a coffee break.">
  <meta name="twitter:card" content="summary">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./.docs/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./.docs/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./.docs/icons/apple-touch-icon.png">
  <link rel="manifest" href="./.docs/icons/site.webmanifest">
  <meta name="theme-color" content="#1f7a52">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" id="dark-css" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css">
  <script src="./.docs/theme-toggle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=PT+Sans&family=JetBrains+Mono&display=swap" rel="stylesheet">

</head>
<style>
  /* Apply fonts */
  .markdown-section {
    font-family: 'Inter', sans-serif;
    line-height: 1.7;
  }
  code, pre {
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.92em !important;
  }
  /* Themes: .docs/theme-toggle.js sets data-theme (which one) and data-mode (light or dark) on <html>. */
  html[data-mode="dark"] .markdown-section code {
    color: #ff8fc0; /* default pink is 3.3:1 on the code background */
  }
  html[data-mode="dark"] .alert.callout.attention .title { color: #ff7b86; }
  html[data-mode="dark"] .alert.callout.important .title { color: #b79af5; }
  /* Mermaid draws arrows and lines in black, invisible on the dark page */
  html[data-mode="dark"] .mermaid .flowchart-link,
  html[data-mode="dark"] .mermaid .edgePath path {
    stroke: #c9d4de !important;
  }
  html[data-mode="dark"] .mermaid marker path {
    fill: #c9d4de !important;
    stroke: #c9d4de !important;
  }
  /* Phones: the top bar (menu, theme toggle) overlaps the page title. */
  @media (max-width: 768px) {
    :root { --scroll-padding-top: 100px; }
    #theme-toggle { right: auto; left: 40px; top: 12px; }
    #theme-menu { right: auto; left: 40px; top: 54px; }
    body:has(.sidebar.show) #theme-toggle, body:has(.sidebar.show) #theme-menu { display: none; }
    section.content { padding-top: 80px !important; }
    /* keep the theme toggle (moon) off the first heading */
    .markdown-section > h1:first-of-type { margin-top: 40px !important; }
  }
  .markdown-section .math-block { overflow-x: auto; padding: 0.2em 0; }
  /* Links to related pages, one line under the page title (added when the site is built) */
  .markdown-section .related-strip { margin: 0.4em 0 1.4em; font-size: 0.92em; line-height: 1.7; color: var(--textColor); opacity: 0.95; }
  .markdown-section .related-strip p { margin: 0; padding: 0.35em 0.8em; border-left: 3px solid var(--borderColor, #ccc); }
    /* Footer under each page: edit link and last-updated date */
  .markdown-section .page-footer {
    margin-top: 3em;
    padding-top: 0.8em;
    border-top: 1px solid var(--borderColor, #ddd);
    font-size: 0.85em;
    opacity: 0.8;
  }
  /* Tables on phones: 2-4 column tables become cards (see .docs/phone-tables.js),
     wider ones scroll sideways instead of squeezing every column. */
  @media (max-width: 768px) {
    .markdown-section table:not(.stack) { display: block; overflow-x: auto; }
    .markdown-section table.stack,
    .markdown-section table.stack tbody,
    .markdown-section table.stack tr,
    .markdown-section table.stack td { display: block; width: 100%; box-sizing: border-box; }
    .markdown-section table.stack thead { display: none; }
    .markdown-section table.stack tr {
      border: 1px solid var(--borderColor, #ddd);
      border-radius: 8px;
      margin: 0 0 12px;
      padding: 8px 14px;
    }
    .markdown-section table.stack td { border: 0; padding: 4px 0; text-align: left; }
    .markdown-section table.stack td:first-child { font-weight: 600; font-size: 1.05em; }
    .markdown-section table.stack td[data-label]::before {
      content: attr(data-label);
      display: block;
      font-size: 0.72em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .markdown-section table.stack tr:nth-child(2n) { background: transparent; }
  }
  /* Colours. Docsify 5 reads --color-bg, --color-text and --theme-color; the
     older names below are what the rest of this page and .docs/search.js use. */
  :root {
    --theme-color: #42b983;
    --color-bg: #ffffff;
    --color-text: #34495e;
    --font-family: 'PT Sans', system-ui, sans-serif;
    --font-size: 17px;
    --background: var(--color-bg);
    --textColor: var(--color-text);
    --borderColor: var(--border-color);
    --accent: var(--theme-color);
    --sidebar-toggle-alignment: end;
    --sidebar-toggle-bg: transparent;
    --sidebar-toggle-color: var(--accent);
    --sidebar-toggle-margin-block: 12px;
  }
  /* One block per theme. --link is the text colour for links (4.5:1 or better on that ground). */
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="sepia"] {
    --color-bg: #f4ecd8; --color-text: #3b2f20; --border-color: #d9cbb0; --link: #7a4a0e;
    --blockquote-color: #5c4d3a; color-scheme: light;
  }
  html[data-theme="dark"] {
    --color-bg: #16181c; --color-text: #d3d6da; --border-color: #3a3f46; --link: #5cc99a; color-scheme: dark;
  }
  html[data-theme="midnight"] {
    --color-bg: #091a28; --color-text: #c4ccd3; --border-color: #2b4257; --link: #5cc99a; color-scheme: dark;
  }
  html[data-theme="black"] {
    --color-bg: #000000; --color-text: #d4d4d4; --border-color: #383838; --link: #5cc99a; color-scheme: dark;
  }
  .sidebar-nav li.active > a, .sidebar-nav a.active { color: var(--link) !important; }
  /* "You are here" in the menu: set by .docs/sidebar-groups.js from the address */
  .sidebar-nav a.here {
    color: var(--link) !important; font-weight: 700;
    background: color-mix(in srgb, var(--link) 14%, transparent);
    border-left: 3px solid var(--link); border-radius: 0 6px 6px 0; padding-left: 8px; margin-left: -11px;
  }
  /* Light theme text that was under 4.5:1 */
  html[data-mode="light"] { --blockquote-color: #55616d; }
  html[data-mode="light"] .markdown-section code { color: #a8420a; }
  html[data-mode="light"] .alert.callout.tip .title { color: #1f7a35; }
  html[data-mode="light"] .alert.callout.important .title { color: #6a38b8; }
  :root { --link: #1a7f52; } /* 5:1 on white; the old green was 2.5:1 */
  /* Say the page colours outright, so nothing around the page (an embedding
     frame, a browser default) can leave dark text on a dark ground or the reverse. */
  html, body { background: var(--color-bg); color: var(--color-text); }
  .sidebar input::placeholder, .search input::placeholder { color: var(--color-text); opacity: 0.7; }
  /* Docsify 5 layout: keep the text column inside the screen. */
  .markdown-section {
    width: auto !important;
    max-width: min(900px, calc(100% - 32px)) !important;
    margin-inline: auto !important;
    padding: 30px 0 40px !important;
  }
  @media (max-width: 768px) {
    app-nav, nav.app-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 14px; }
  }
  @media (min-width: 1400px) { section.content { padding-right: 240px; } }
  /* Page outline (wide screens), see .docs/page-outline.js */
  aside.page-outline {
    position: fixed; top: 110px; right: 24px; width: 200px; max-height: 70vh; overflow-y: auto;
    font-size: 0.8rem; line-height: 1.4;
    border-left: 1px solid var(--borderColor, #ddd); padding-left: 12px;
  }
  aside.page-outline p { margin: 0 0 6px; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; }
  aside.page-outline a { display: block; padding: 2px 0; color: var(--textColor, inherit); opacity: 0.75; text-decoration: none; }
  aside.page-outline a.sub { padding-left: 12px; }
  aside.page-outline a.active { opacity: 1; color: var(--link); font-weight: 600; }
  .markdown-section pre, .markdown-section table, .markdown-section .math-block { max-width: 100%; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  /* The top menu stays on screen in Docsify 5; give it a background so text does not run through it */
  nav.app-nav { background: var(--color-bg); border-radius: 8px; padding: 2px 10px; }
  /* Theme button (see .docs/theme-toggle.js) */
  #theme-toggle {
    position: absolute; top: 74px; right: 16px; z-index: 60;
    width: 36px; height: 36px; padding: 6px; border: 0; border-radius: 50%;
    background: transparent; color: var(--color-text); cursor: pointer; opacity: 0.8;
  }
  #theme-toggle:hover { opacity: 1; }
  #theme-menu {
    position: absolute; top: 114px; right: 16px; z-index: 61; min-width: 170px; padding: 6px;
    background: var(--color-bg); color: var(--color-text); border: 1px solid var(--border-color);
    border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  #theme-menu[hidden] { display: none; }
  #theme-menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px;
    background: transparent; color: inherit; font: inherit; font-size: 0.95rem; text-align: left; cursor: pointer;
  }
  #theme-menu button:hover { background: var(--color-mono-2, rgba(128, 128, 128, 0.15)); }
  #theme-menu button[aria-checked="true"] { font-weight: 700; color: var(--link); }
  #theme-menu .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-color); flex: none; }
  #theme-toggle svg { display: block; }
  /* Sidebar groups (see .docs/sidebar-groups.js) */
  .sidebar-nav li.group > strong { cursor: pointer; position: relative; }
  .sidebar-nav li.group > strong::before {
    content: ''; position: absolute; left: -14px; top: 0.55em; width: 6px; height: 6px;
    border-right: 1px solid currentColor; border-bottom: 1px solid currentColor;
    transform: rotate(45deg); opacity: 0.6; transition: transform 0.1s;
  }
  .sidebar-nav li.group.collapsed > strong::before { transform: rotate(-45deg); }
  .sidebar-nav li.group.collapsed > ul { display: none; }
  /* Look of Docsify 4 kept: green bold links, no underline, compact menu */
  .markdown-section a:not(.anchor) {
    color: var(--link); font-weight: 600; text-decoration: none !important;
    background: none !important;
  }
  .markdown-section a:not(.anchor):hover { text-decoration: underline !important; }
  :root { --sidebar-font-size: 15px; }
</style>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'aCupOfTea',
      repo: 'AhmedYousriSobhi/aCupOfTea',
      // basePath: '../', // Tell docsify to look for the markdown files in the parent directory
      loadSidebar: './.docs/_sidebar.md',
      loadNavbar: './.docs/_navbar.md',
      notFoundPage: './.docs/_404.md',
      relativePath: false, // Use relative paths for sidebar and navbar links
      // Below 1400px the right-hand outline is hidden, so list the page's
      // sections (h2, h3) under it in the sidebar instead.
      subMaxLevel: window.matchMedia('(max-width: 1399px)').matches ? 3 : 0,
      auto2top: true,
      plugins: [window.themeToggle],
       pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      // Configure the tabs plugin
      tabs: {
        persist: true,      // stay on the same tab when refreshing
        sync: true,         // sync tabs with same label across page
        theme: 'classic',   // 'classic' or 'material'
      },
      // Add this to help Docsify match URLs to the sidebar entries
      alias: {
        '/(.*)/_sidebar.md': './.docs/_sidebar.md',
        '/(.*)/_navbar.md': './.docs/_navbar.md'
      },
    }
  </script>
  <script>
    // On phones the sidebar covers the page: close it after a section link is
    // tapped so the reader lands on the heading, not on the menu.
    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('.sidebar-nav a.section-link');
      if (!link || window.innerWidth > 768) return;
      setTimeout(function () {
        var open = document.querySelector('aside.sidebar.show');
        var toggle = document.querySelector('button.sidebar-toggle');
        if (open && toggle) toggle.click();
      }, 0);
    });
  </script>
  <script src="./.docs/math.js"></script>
  <!-- Mermaid and KaTeX load only on pages that use them -->
  <script src="./.docs/lazy-libs.js"></script>
  <script src="./.docs/phone-tables.js"></script>
  <script src="./.docs/lazy-images.js"></script>
  <script src="./.docs/page-footer.js"></script>
  <script src="./.docs/page-outline.js"></script>
  <!-- Two-group search (replaces the built-in Docsify search) -->
  <script src="./.docs/search.js"></script>
  <!-- Docsify v5 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/zoom-image.min.js"></script>
  <!-- On phones, tapping a picture opens it full size to pan and pinch -->
  <script src="./.docs/image-viewer.js"></script>
  <!-- Hides YAML front matter (title, summary, tags) from the rendered page -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/front-matter.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1.6.3/dist/docsify-tabs.min.js"></script>
  <script src="./.docs/sidebar-groups.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.3.0/dist/docsify-plugin-flexible-alerts.min.js"></script>

</body>
</html>
