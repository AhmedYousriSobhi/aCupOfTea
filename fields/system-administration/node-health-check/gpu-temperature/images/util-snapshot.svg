<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Utilization of a busy GPU dips to zero for a moment. A single sample taken in the dip says idle, but memory in use stays high the whole time, which shows a workload is attached.">
<style>
:root{--bg:#fff;--fg:#222;--box:#eef3ff;--line:#4a6cf7;--bad:#d33;--ok:#1a8f4c;--warn:#e8a200;--soft:#9aa5c4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e24;--fg:#e8e8e8;--box:#262c3a;--line:#8aa2ff;--bad:#ff6b6b;--ok:#4cd68a;--warn:#ffc233;--soft:#6b7390}}
rect.bg{fill:var(--bg)} text{fill:var(--fg);font-family:system-ui,sans-serif}
.u{stroke:var(--line);stroke-width:3;fill:none}
.m{fill:var(--ok);opacity:.85}
.cursor{stroke:var(--warn);stroke-width:3;animation:mv 8s infinite}
.say{animation:say 8s infinite;font-size:15px;font-weight:600}
@keyframes mv{0%{transform:translateX(0)}60%,100%{transform:translateX(290px)}}
@keyframes say{0%,55%{opacity:0}65%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none;transform:translateX(290px)}.say{animation:none;opacity:1}}
</style>
<rect class="bg" width="640" height="250"/>
<text x="30" y="34" font-size="13">GPU utilization (%)</text>
<path class="u" d="M40 60 L120 52 L190 66 L250 58 L300 64 L320 140 L340 140 L360 62 L430 56 L500 64 L600 58"/>
<line x1="40" y1="140" x2="610" y2="140" style="stroke:var(--soft);stroke-width:1"/>
<text x="30" y="160" font-size="11">0%</text>
<line class="cursor" x1="40" y1="40" x2="40" y2="215"/>
<text x="30" y="188" font-size="13">GPU memory in use</text>
<rect class="m" x="40" y="196" width="570" height="18" rx="3"/>
<text class="say" x="330" y="236" text-anchor="middle">one sample at 0% says "idle". The memory bar says a workload is attached.</text>
</svg>
