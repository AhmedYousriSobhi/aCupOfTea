<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Two directories on two machines. SlurmdSpoolDir on every compute node holds job scripts, credential state, config cache and step sockets, and a full disk drains the node. StateSaveLocation on the controller holds jobs, nodes and reservations and should be backed up before upgrades.">
<style>
:root{--bg:#fff;--fg:#222;--box:#eef3ff;--line:#4a6cf7;--bad:#d33;--ok:#1a8f4c;--warn:#e8a200;--soft:#9aa5c4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e24;--fg:#e8e8e8;--box:#262c3a;--line:#8aa2ff;--bad:#ff6b6b;--ok:#4cd68a;--warn:#ffc233;--soft:#6b7390}}
rect.bg{fill:var(--bg)} text{fill:var(--fg);font-family:system-ui,sans-serif}
.box{fill:var(--box);stroke:var(--line);stroke-width:2}
.p1{animation:p1 8s infinite}.p2{animation:p2 8s infinite}.c1{animation:c1 8s infinite;font-size:14px;fill:var(--bad);font-weight:600}.c2{animation:c2 8s infinite;font-size:14px;fill:var(--ok);font-weight:600}
@keyframes p1{0%,5%{stroke:var(--line)}10%,45%{stroke:var(--bad);stroke-width:5}55%,100%{stroke:var(--line)}}
@keyframes p2{0%,50%{stroke:var(--line)}58%,95%{stroke:var(--ok);stroke-width:5}100%{stroke:var(--line)}}
@keyframes c1{0%,8%{opacity:0}14%,46%{opacity:1}52%,100%{opacity:0}}
@keyframes c2{0%,55%{opacity:0}62%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.p1,.p2,.c1,.c2{animation:none}.c1,.c2{opacity:1}}
</style>
<rect class="bg" width="640" height="230"/>
<rect class="box p1" x="30" y="30" width="270" height="110" rx="10"/>
<text x="165" y="58" font-size="15" text-anchor="middle" font-weight="600">Every compute node</text>
<text x="165" y="80" font-size="13" text-anchor="middle">SlurmdSpoolDir (local disk)</text>
<text x="165" y="104" font-size="12" text-anchor="middle">job scripts, credential state,</text><text x="165" y="120" font-size="12" text-anchor="middle">config cache, step sockets</text>
<rect class="box p2" x="340" y="30" width="270" height="110" rx="10"/>
<text x="475" y="58" font-size="15" text-anchor="middle" font-weight="600">The controller</text>
<text x="475" y="80" font-size="13" text-anchor="middle">StateSaveLocation</text>
<text x="475" y="104" font-size="12" text-anchor="middle">jobs, nodes, reservations</text>
<text class="c1" x="165" y="180" text-anchor="middle">full = this node drains</text>
<text class="c2" x="475" y="180" text-anchor="middle">back it up before upgrades</text>
</svg>
