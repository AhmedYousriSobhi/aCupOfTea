<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Timeline: the node drains at 02:14, you resume it at 02:30, and it drains again at 03:10 because the disk is still being filled.">
<style>
:root{--bg:#fff;--fg:#222;--box:#eef3ff;--line:#4a6cf7;--bad:#d33;--ok:#1a8f4c;--warn:#e8a200;--soft:#9aa5c4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e24;--fg:#e8e8e8;--box:#262c3a;--line:#8aa2ff;--bad:#ff6b6b;--ok:#4cd68a;--warn:#ffc233;--soft:#6b7390}}
rect.bg{fill:var(--bg)} text{fill:var(--fg);font-family:system-ui,sans-serif}
.line{stroke:var(--soft);stroke-width:3}
.dot{animation:m 9s infinite}
.l1{animation:l1 9s infinite;font-size:14px}.l2{animation:l2 9s infinite;font-size:14px}.l3{animation:l3 9s infinite;font-size:15px;font-weight:600;fill:var(--bad)}
@keyframes m{0%{transform:translateX(0);fill:var(--bad)}30%{transform:translateX(0);fill:var(--bad)}38%{transform:translateX(250px);fill:var(--ok)}70%{transform:translateX(250px);fill:var(--ok)}78%,100%{transform:translateX(500px);fill:var(--bad)}}
@keyframes l1{0%,5%{opacity:0}12%,100%{opacity:1}}
@keyframes l2{0%,35%{opacity:0}42%,100%{opacity:1}}
@keyframes l3{0%,76%{opacity:0}84%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot,.l1,.l2,.l3{animation:none}.dot{transform:translateX(500px);fill:var(--bad)}}
</style>
<rect class="bg" width="640" height="230"/>
<line class="line" x1="60" y1="100" x2="580" y2="100"/>
<circle class="dot" cx="70" cy="100" r="13"/>
<text class="l1" x="70" y="150" text-anchor="middle">02:14</text><text class="l1" x="70" y="170" font-size="12" text-anchor="middle">DRAINED</text>
<text class="l2" x="320" y="150" text-anchor="middle">02:30</text><text class="l2" x="320" y="170" font-size="12" text-anchor="middle">you: RESUME</text>
<text class="l3" x="570" y="150" text-anchor="middle">03:10</text><text class="l3" x="570" y="170" font-size="12" text-anchor="middle">drained again</text>
<text x="320" y="40" font-size="14" text-anchor="middle">Resuming fixes the label. Only free space fixes the node.</text>
</svg>
