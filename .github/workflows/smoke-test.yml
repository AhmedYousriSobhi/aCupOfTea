name: Smoke test

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "index.html"
      - ".docs/**"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # page footers and "Recently added" read git history

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML==6.0.2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Playwright, Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Stage the site
        run: python3 -I .docs/tools/stage_site.py --out _site

      - name: Browser checks in Chromium (Android, desktop Chrome and Edge)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .docs/tests/smoke.js _site chromium

      - name: Browser checks in WebKit (every iPhone browser, Safari)
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .docs/tests/smoke.js _site webkit
