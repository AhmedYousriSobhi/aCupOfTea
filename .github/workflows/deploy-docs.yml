name: Deploy Docsify to GitHub Pages

on:
  push:
    branches:
      - main
      - chor_docsify_integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            ref: main

      - name: Generate Navigation
        run: |
          # Make scripts executable
          chmod +x .docs/gen_sidebar.sh
          chmod +x .docs/gen_navbar.sh
          
          # Run scripts from within the .docs directory
          cd .docs
          ./gen_sidebar.sh
          ./gen_navbar.sh
          cd ..

      - name: Ensure .nojekyll exists
        run: touch .nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # Since index.html is in root, we publish the whole directory
          publish_dir: .
          force_orphan: true