name: Deploy Docsify to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:  
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Fixes the deprecation warning and ensures future-proofing
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML==6.0.2

      - name: Validate and generate metadata indexes
        run: |
          python3 -I .docs/tools/validate.py
          python3 -I .docs/tools/generate_index.py

      - name: Generate Navigation
        run: |
          # Make scripts executable
          chmod +x .docs/gen_sidebar.sh
          chmod +x .docs/gen_navbar.sh
          
          # Run scripts from within the .docs directory
          cd .docs
          ./gen_sidebar.sh
          ./gen_navbar.sh
          cd ..

      - name: Stage site (strip front matter, append Related blocks)
        run: |
          python3 -I .docs/tools/stage_site.py --out _site
          rm -f _site/.stage-site
          touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # The staging copy: sources in the repo are never rewritten
          publish_dir: _site
          force_orphan: true
