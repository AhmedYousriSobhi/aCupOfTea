name: Validate metadata

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the release check reads git history

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML==6.0.2

      - name: Run the validation suite
        # front matter, internal links, generated indexes + sidebar + navbar up to date, all test_*.py
        run: python3 -I .docs/tools/check_all.py

      - name: Check the README "Recently added" list (release PRs to main)
        if: github.base_ref == 'main'
        run: python3 -I .docs/tools/update_recent.py --check
