name: Check pinned versions

on:
  schedule:
    - cron: "0 6 1 * *"   # the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compare pins with the latest npm releases
        run: |
          python3 -I .docs/tools/check_pins.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Check the integrity hashes still match the CDN files
        if: always()
        run: |
          python3 -I .docs/tools/check_pins.py --sri --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
