# Controlled vocabulary. Add a value here before using it in a page.
# Keys are kebab-case ids; label is for display.
#
# A page may carry up to 3 domains, and they should be related: a domain lists the ones it
# goes with in `related` (read both ways, so list a pair once). validate.py warns when two domains
# of one page are not related.
#
# Tag rule: a tag needs 2+ pages, or must name a concrete technology
# (marked `kind: technology`). Max 5 tags per page.

version: 1

types:
  concept: Explains an idea, theory, principle or technique.
  guide: Shows how to do something; practical steps, setup or procedures.
  reference: Lookup material such as cheat sheets, terminology or command lists.
  note: Short informal write-up, summary or context that is not a full explanation.
  problem: A reusable problem formulation, with or without a solution.
  project: A concrete implementation addressing a defined problem.
  experiment: Exploratory or temporary investigation.

statuses:
  - draft
  - stable
  - deprecated

levels:
  - beginner
  - intermediate
  - advanced

relation_types:      # exact names used in front matter
  - related
  - prerequisites

domains:
  machine-learning:
    label: Machine Learning
    description: Learning from data, general ML theory and practice.
    related: [deep-learning, statistics, recommender-systems, reinforcement-learning, generative-ai, natural-language-processing]
  deep-learning:
    label: Deep Learning
    description: Neural networks and deep architectures.
    related: [machine-learning, generative-ai, natural-language-processing, reinforcement-learning, recommender-systems, software-engineering]
  generative-ai:
