/* The questions about a page. The essentials (summary, kind, subjects) come first; tags, level and related
   pages are folded into "More options". Fields in `have` are already in the page and left alone. */
function metaForm(opts, have = [], onChange = () => {}, titleOf = () => "") {
  const limits = opts.limits;
  const summary = h("input", { type: "text", maxlength: "200" });
  const count = h("span", { class: "hint", "aria-live": "off" }, "0/200");
  summary.addEventListener("input", () => { count.textContent = summary.value.length + "/200"; onChange(); });
  const types = checkGroup({ items: opts.types, max: limits.types, onChange: () => onChange(), decorate: it => kindIcon(it.key) });
  const domains = checkGroup({ items: opts.domains, max: limits.domains, onChange: () => { onChange(); checkRelated(); }, decorate: it => dot(it.key) });
  const newDomains = [], newTypes = [];
  const addDomain = addBox({ keyLabel: "New subject", keyPlaceholder: "key, e.g. devops", button: "Add subject",
    toggleText: "+ a subject that does not exist yet", onAdd(d) { if (!domains.add(d)) return false; newDomains.push(d); } });
  const addType = addBox({ keyLabel: "New kind", keyPlaceholder: "key, e.g. tutorial", button: "Add kind",
    toggleText: "+ a kind of page that is not listed", onAdd(d) { if (!types.add(d)) return false; newTypes.push(d); } });
  /* Subjects of one page should go together: say so when two are not marked as related in taxonomy.yaml. */
  const relNote = h("div", { class: "hint", "aria-live": "polite", role: "status" });
  const graph = h("div", { class: "graph" });
  const labelOf = key => (opts.domains.find(d => d.key === key) || { label: titleCase(key) }).label;
  function checkRelated() {
    const picked = domains.get(), fresh = newDomains.map(d => d.key), bad = [];
    picked.forEach((a, i) => picked.slice(i + 1).forEach(b => {
      if (!fresh.includes(a) && !fresh.includes(b) && !(opts.related[a] || []).includes(b)) bad.push(labelOf(a) + " and " + labelOf(b));
    }));
    drawGraph(picked, fresh);
    relNote.textContent = bad.length ? "\u26a0 " + bad.join("; ") + (bad.length > 1 ? " are" : " is") + " not marked as related in taxonomy.yaml. A page usually belongs to one area; this is only a warning, you can still create it." : "";
  }
  /* the chosen subjects as a small map: a solid line where two go together, a dashed red one where they are not related */
  function drawGraph(picked, fresh) {
    if (picked.length < 2) { graph.replaceChildren(); return; }
    const W = 300, H = 120, pos = picked.length === 2 ? [[70, 60], [230, 60]] : [[150, 22], [60, 96], [240, 96]];
    const rel = (a, b) => fresh.includes(a) || fresh.includes(b) || (opts.related[a] || []).includes(b);
    const lines = [], nodes = [];
    picked.forEach((a, i) => picked.slice(i + 1).forEach((b, j) => {
      const [x1, y1] = pos[i], [x2, y2] = pos[i + 1 + j], ok = rel(a, b);
      lines.push(sv("line", { x1, y1, x2, y2, class: ok ? "ok" : "odd" }));
      if (!ok) lines.push(sv("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 4, "text-anchor": "middle", style: "fill:var(--err);font-weight:700" }, "not related"));
    }));
    picked.forEach((a, i) => nodes.push(sv("circle", { cx: pos[i][0], cy: pos[i][1], r: 7, class: "node", style: "stroke:hsl(" + hue(a) + " 55% 42%)" }),
      sv("text", { x: pos[i][0], y: pos[i][1] + (picked.length === 3 && i === 0 ? -12 : 21), "text-anchor": "middle" }, labelOf(a))));
    const svg = sv("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img",
      "aria-label": "How the chosen subjects relate: " + picked.map(labelOf).join(", ") }, lines, nodes);
    graph.replaceChildren(svg);
  }
  domains.el.addEventListener("change", checkRelated);
  const moreNote = h("span", { class: "hint" });
  const tags = chipInput({ known: opts.tags.map(t => ({ value: t.key, label: t.label })), max: limits.tags, newLabel: true,
    suggest: v => nearWord(v, [opts.tags.map(t => t.key), titleOf().toLowerCase().match(/[a-z0-9]+/g) || []]), onChange: () => { moreChanged(); onChange(); } });
  const level = h("select", {}, h("option", { value: "" }, "(none)"), opts.levels.map(l => h("option", { value: l }, l)));
  level.addEventListener("change", () => { moreChanged(); onChange(); });
  const ids = opts.pages.map(p => ({ value: p.id, label: p.title }));
  const prereq = chipInput({ known: ids, onChange: () => { moreChanged(); onChange(); } });
  const related = chipInput({ known: ids, onChange: () => { moreChanged(); onChange(); } });
  const keep = (key, make) => have.includes(key) ? null : make();
  const moreParts = [
    keep("tags", () => field("Tags", "up to " + limits.tags + "; a new tag is added to taxonomy.yaml", tags.el, tags.input)),
    keep("level", () => field("Level", "beginner pages show under Beginner friendly", level, level)),
    keep("relations", () => h("div", {},
      field("Read first (prerequisites)", "ids of pages", prereq.el, prereq.input),
      field("See also (related)", "ids of pages", related.el, related.input)))].filter(Boolean);
  function moreChanged() {
    const bits = [];
    if (tags.state.items.length) bits.push(tags.state.items.length + " tag" + (tags.state.items.length > 1 ? "s" : ""));
    if (level.value) bits.push(level.value);
    if (prereq.state.items.length + related.state.items.length) bits.push((prereq.state.items.length + related.state.items.length) + " related");
    moreNote.textContent = bits.length ? " – " + bits.join(", ") : " – tags, level, related pages";
  }
  moreChanged();
  const more = moreParts.length ? h("details", { class: "more" }, h("summary", {}, "More options (optional)", moreNote), ...moreParts) : null;
  const keepNote = have.length ? h("div", { class: "box", role: "status" }, "Already in the front matter, kept as it is: " + have.join(", ")) : null;
  const el = h("div", {},
    keepNote,
    keep("summary", () => field("Summary", "one line shown in search and Explore", h("div", {}, summary, count), summary)),
    keep("type", () => field("Kind of page", "one or two; the first you pick is the main one", h("div", {}, types.el, addType))),
    keep("domains", () => field("Subjects", "up to " + limits.domains + " that go together; they put the page in Explore by subject", h("div", {}, domains.el, graph, relNote, addDomain))),
    more);
  const values = () => ({ summary: summary.value, types: types.get(), domains: domains.get(), tags: tags.state.items,
    level: level.value, prerequisites: prereq.state.items, related: related.state.items,
    new_domains: newDomains.filter(d => domains.get().includes(d.key)),
    new_types: newTypes.filter(d => types.get().includes(d.key)),
    new_tags: tags.state.items.filter(t => tags.state.isNew.has(t)).map(t => ({ key: t, label: titleCase(t) })) });
  return { el, more, types, domains, tags, level, summary, prereq, related, values,
    /* put saved answers back (a draft) */
    restore(v) {
      summary.value = v.summary || ""; count.textContent = summary.value.length + "/200";
      types.set([]); domains.set([]);               // room for the saved new ones
      for (const d of v.new_domains || []) if (!domains.has(d.key)) { newDomains.push(d); domains.add(d); }
      for (const d of v.new_types || []) if (!types.has(d.key)) { newTypes.push(d); types.add(d); }
      types.set(v.types || []); domains.set(v.domains || []);
      tags.set(v.tags || []); level.value = v.level || ""; prereq.set(v.prerequisites || []); related.set(v.related || []);
      moreChanged();
    } };
}

/* Show a result (or error) where the person is looking, and move focus there for screen readers. */
function resultBox(host, headline = "Brewed! Your page is ready.", party = true) {
  return (result) => {
    if (result.ok !== false && result.page) {
      const c = cup(44, 1);
      host.replaceChildren(h("div", { class: "brewed", role: "status" }, c.el,
        h("div", {}, h("strong", {}, headline), h("span", { class: "path" }, result.page))));
      if (party) confetti();
      host.append(h("details", {}, h("summary", { class: "hint" }, "What the tool did"), message("ok", result.output || "")));
    } else {

    }
    if (result.check) host.append(h("div", { class: "hint" }, "Checklist for the page:"), h("pre", {}, result.check));
    if (result.page) {
      const note = h("div");
      host.append(h("div", { class: "actions" },
        h("button", { type: "button", onclick: async () => note.replaceChildren(message("ok", (await api("/api/open", { path: result.page, line: 1 })).output)) }, "Open in editor"),
        h("button", { type: "button", onclick: async () => note.replaceChildren(message("ok", (await api("/api/reindex", {})).output)) }, "Update the generated indexes"),
        h("button", { type: "button", onclick: () => { loaded.new = false; show("new"); } }, "Start another page")), note);
    }
    host.setAttribute("tabindex", "-1"); host.focus({ preventScroll: true }); host.scrollIntoView({ block: "nearest" });
  };
}

/* A filter box over a list of pages: type words of the path, title or anything in `extra(p)`. Enter picks the first
   match, the down arrow moves into the list, Esc clears. `onChoose(page)` runs when one is picked. */
function pagePicker({ pages, label, extra = () => "", onChoose, card }) {
  const filter = h("input", { type: "text", placeholder: "Type to filter: path, title or a word from the list", autocomplete: "off" });
  const list = h("select", { size: "8", "aria-label": "Pages" });
  const count = h("div", { class: "hint", "aria-live": "polite" });
  const cardBox = h("div");
  let current = "";
  const matches = () => {
    const words = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    return pages.filter(p => { const hay = (p.path + " " + p.title + " " + extra(p)).toLowerCase(); return words.every(w => hay.includes(w)); });
  };
  function render() {
    const found = matches();
    list.replaceChildren(...found.map(p => { const o = h("option", { value: p.path }, label(p)); if (p.path === current) o.selected = true; return o; }));
    count.textContent = found.length === pages.length ? pages.length + " pages" : found.length + " of " + pages.length + " pages" + (found.length ? "; Enter picks the first, ↓ moves into the list" : "; nothing matches");
  }
  function choose(path) {
    const p = pages.find(x => x.path === path);
    if (!p || path === current) return;
    current = path; cardBox.replaceChildren(...(card ? [card(p)] : [])); onChoose(p);
  }
  filter.addEventListener("input", render);
  filter.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const first = matches()[0]; if (first) { choose(first.path); render(); } }
    else if (e.key === "ArrowDown" && list.options.length) { e.preventDefault(); list.focus(); if (list.selectedIndex < 0) list.selectedIndex = 0; }
    else if (e.key === "Escape") { filter.value = ""; render(); }
  });
  list.addEventListener("change", () => choose(list.value));
  render();
  return { el: h("div", {}, field("Find a page", "", filter, filter), count, h("div", { class: "hint" }, "Pick one:"), list, cardBox),
    get current() { return current; }, focus: () => filter.focus() };
}
const FIELD_NAMES = { summary: "summary", type: "kind", domains: "subjects", tags: "tags", level: "level" };
const pageCard = p => h("div", { class: "pcard" }, h("div", { class: "cap" }, "Selected"), h("h3", {}, p.title || p.path), h("div", { class: "path" }, p.path),
  h("div", { class: "meta" }, (p.have || []).map(k => h("span", { class: "tag" }, "✓ " + FIELD_NAMES[k])), (p.missing || []).map(k => h("span", { class: "tag empty" }, "missing: " + FIELD_NAMES[k]))));

  const adoptBtn = h("button", { type: "button", class: "primary", onclick: () => submit(adoptBtn, false) }, "Add front matter");
  view.replaceChildren(
    h("p", { class: "hint" }, "For a page you wrote by hand: this adds the front matter and the folder index row. The text of the page is never changed."),
    h("fieldset", {}, h("legend", {}, "Page"), picker.el),
    h("fieldset", {}, h("legend", {}, "About the page"), holder),
    h("div", { class: "actions sticky" }, previewBtn, adoptBtn),
    out);
}

/* ---------- Edit ---------- */
async function editTab(view) {
  const opts = await api("/api/options");
  const pages = await api("/api/editable");
  const holder = h("div"), out = h("div");
  let meta = null;
  const picker = pagePicker({ pages, label: p => p.path + (p.title ? "  –  " + p.title : ""),
    extra: p => [p.values.types.join(" "), p.values.domains.join(" "), p.values.tags.join(" "), p.values.level].join(" "),
    card: p => h("div", { class: "pcard" }, h("div", { class: "cap" }, "Now"), h("h3", {}, p.title || p.path), h("div", { class: "path" }, p.path),
      h("div", {}, p.values.summary || h("span", { class: "empty" }, "(no summary)")),
      h("div", { class: "meta" }, p.values.types.map(t => h("span", { class: "tag" }, kindIcon(t), t)),
        p.values.domains.map(d => h("span", { class: "tag" }, dot(d), d)), p.values.tags.map(t => h("span", { class: "tag" }, "#" + t)),
        p.values.level ? h("span", { class: "tag" }, p.values.level) : null)),
    onChoose(p) { out.replaceChildren(); meta = metaForm(opts, []); holder.replaceChildren(meta.el); meta.restore(p.values);
      if (meta.more && (p.values.tags.length || p.values.level || p.values.prerequisites.length || p.values.related.length)) meta.more.open = true; } });
  const submit = async (btn, dry) => {
    if (!meta) { resultBox(out)({ ok: false, output: "Choose a page first." }); picker.focus(); return; }
    await busy(btn, async () => {
      const r = await api("/api/update", Object.assign({ page: picker.current, dry_run: dry }, meta.values()));
      resultBox(out, "Saved. The page text is unchanged.", false)(r);
    });
  };
  const previewBtn = h("button", { type: "button", onclick: () => submit(previewBtn, true) }, "Preview the change");
  const saveBtn = h("button", { type: "button", class: "primary", onclick: () => submit(saveBtn, false) }, "Save changes");
  view.replaceChildren(
    h("p", { class: "hint" }, "Change the summary, kind, subjects, tags, level or related pages of a page that already has front matter. Only what you change is rewritten; the text of the page stays as it is."),
    h("fieldset", {}, h("legend", {}, "Page"), picker.el),
    h("fieldset", {}, h("legend", {}, "About the page"), holder),
    h("div", { class: "actions sticky" }, previewBtn, saveBtn),
    out);
}

/* ---------- Pictures ---------- */
async function imagesTab(view) {
  const pages = await api("/api/pages");
  const files = h("input", { type: "file", multiple: true, accept: ".png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp" });
  const rows = h("div"), out = h("div");
  const picker = pagePicker({ pages, label: p => p.path + (p.title ? "  –  " + p.title : ""), onChoose() { out.replaceChildren(); } });
  const entries = [];
  files.addEventListener("change", () => {
    entries.length = 0; rows.replaceChildren();
    for (const f of files.files) {
      const alt = h("input", { type: "text", "aria-label": "What does " + f.name + " show?", placeholder: "What does it show? (needed: screen readers and search use it)" });
      const big = f.size > 5 * 1024 * 1024;
      const thumb = h("img", { src: URL.createObjectURL(f), alt: "", style: "flex:none;width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)" });
      rows.append(h("div", { class: "row", style: "align-items:center;margin:8px 0" }, thumb, h("div", {}, h("div", { class: "path" }, f.name + " (" + Math.ceil(f.size / 1024) + " KB)"),
        big ? h("div", { class: "err-text" }, "Over 5 MB: too big for the repo, make it smaller first.") : alt)));
      if (!big) entries.push({ file: f, alt });
    }
  });
  const toBase64 = file => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(file); });
  const upload = async btn => {
    if (!picker.current) { out.replaceChildren(message("err", "Choose the page the pictures belong to.")); picker.focus(); return; }
    if (!entries.length) { out.replaceChildren(message("err", "Choose at least one picture.")); files.focus(); return; }
    await busy(btn, async () => {
      out.replaceChildren();
      for (const e of entries) {
        const r = await api("/api/image", { page: picker.current, filename: e.file.name, alt: e.alt.value, data: await toBase64(e.file) });
        if (!r.ok) { out.append(message("err", e.file.name + ": " + r.output)); e.alt.setAttribute("aria-invalid", "true"); continue; }
        const copyBtn = h("button", { type: "button", onclick: async () => {
          try { await navigator.clipboard.writeText(r.snippet); copyBtn.textContent = "Copied"; } catch (x) { copyBtn.textContent = "Select and copy it"; } } }, "Copy");
        out.append(h("div", { class: "box ok", role: "status" }, h("div", {}, r.output), h("pre", {}, r.snippet), copyBtn));
      }
    });
  };
  const uploadBtn = h("button", { type: "button", class: "primary", onclick: () => upload(uploadBtn) }, "Save pictures");
  view.replaceChildren(
    h("p", { class: "hint" }, "Pictures are saved next to the page, in its images/ folder, so they stay with it (PNG, JPEG, GIF or WebP, up to 5 MB). Paste the line you get into the page."),
    h("fieldset", {}, h("legend", {}, "Page"), picker.el),
    h("fieldset", {}, h("legend", {}, "Pictures"), field("Choose pictures", "", files, files), rows),
    h("div", { class: "actions sticky" }, uploadBtn), out);
}

/* ---------- Fix problems ---------- */
function diffEl(text) {
  return h("pre", { class: "diff", tabindex: "0", "aria-label": "Suggested change" }, text.split("\n").map(l => h("div", { class: l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : "" }, l || " ")));
}
const LEVEL_ICON = {
  error: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15 9l-6 6M9 9l6 6",
  warning: "M12 3l10 18H2zM12 10v5M12 18h.01",
  todo: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",
};
async function fixTab(view) {
  const scope = h("select", {}, h("option", { value: "changed" }, "Files changed since dev"), h("option", { value: "all" }, "Whole repository"), h("option", { value: "pictures" }, "Pictures without a description"));
  const custom = h("input", { type: "text", placeholder: "or a path, then Enter" });
  const list = h("div", { "aria-live": "polite" }), status = h("div", { "aria-live": "polite" });
  const notice = h("div");              // what the last applied fix changed; stays while the list refreshes
  const current = () => custom.value.trim() || (scope.value === "pictures" ? "all" : scope.value);
  const pics = () => !custom.value.trim() && scope.value === "pictures";
  const query = () => "scope=" + encodeURIComponent(current()) + (pics() ? "&pictures=1" : "");
  async function load() {
    list.setAttribute("aria-busy", "true");
    list.replaceChildren(h("div", { class: "hint" }, "Checking..."));
    try {
      const issues = await api("/api/issues?" + query());
      const by = l => issues.filter(i => i.level === l).length;
      status.replaceChildren(issues.length
        ? h("div", { class: "counts", role: "status" }, [["error", "errors"], ["warning", "warnings"], ["todo", "to-dos"]].filter(([l]) => by(l)).map(([l, w]) =>
            h("span", { class: "badge " + l }, icon(LEVEL_ICON[l], 16), by(l) + " " + w)))
        : h("div", { class: "allclear", role: "status" }, cup(56, 1).el, h("strong", {}, "All clear."), "Nothing to fix. Time for a cup of tea."));
      list.replaceChildren(...issues.map(card));
    } catch (e) { list.replaceChildren(message("err", e.message)); }
    list.removeAttribute("aria-busy");
  }
  function card(i) {
    const detail = h("div");
    return h("article", { class: "issue" },
      h("div", {}, h("span", { class: "badge " + i.level }, icon(LEVEL_ICON[i.level] || LEVEL_ICON.todo, 14), i.level), h("span", { class: "path" }, i.path + ":" + i.line)),
      h("div", {}, i.message), i.hint ? h("div", { class: "hint" }, i.hint) : null,
      h("div", { class: "actions" },
        i.path.endsWith(".md") ? h("button", { type: "button", onclick: async () => detail.replaceChildren(message("ok", (await api("/api/open", { path: i.path, line: i.line })).output)) }, "Open in editor") : null,
        i.fixes.map((f, n) => h("button", { type: "button", onclick() {
          const valueBox = f.input ? h("input", { type: "text", "aria-label": f.input, placeholder: f.input }) : null;
          const apply = h("button", { type: "button", class: "primary", onclick: () => busy(apply, async () => {
            const r = await api("/api/fix", { id: i.id, fix: n, scope: current(), pictures: pics(), value: valueBox ? valueBox.value : undefined });
            notice.replaceChildren(message(r.ok ? "ok" : "err", r.output));
            if (r.ok) await load(); else detail.replaceChildren(message("err", r.output)); }) }, "Apply this change");
          detail.replaceChildren(h("div", { class: "hint" }, f.label), valueBox || diffEl(f.diff), h("div", { class: "actions" }, apply,
            h("button", { type: "button", onclick: () => detail.replaceChildren() }, "Cancel")));
          (valueBox || apply).focus(); } }, "Fix: " + f.label))),
      detail);
  }
  const recheck = () => { notice.replaceChildren(); load(); };
  scope.addEventListener("change", () => { custom.value = ""; recheck(); });
  custom.addEventListener("keydown", e => { if (e.key === "Enter") recheck(); });
  scope.setAttribute("aria-label", "Which files to check"); custom.setAttribute("aria-label", "Page or folder path");
  view.replaceChildren(h("div", { class: "row" }, scope, custom, h("button", { type: "button", onclick: recheck }, "Check again")), notice, status, list);
  load();
}

/* ---------- tabs ---------- */
document.getElementById("logo").prepend(cup(40, 0.8).el);
document.querySelector("#logo .cup").classList.add("hot");
const tabs = { new: newTab, adopt: adoptTab, edit: editTab, images: imagesTab, fix: fixTab };
const loaded = {};
async function show(name, focus) {
  for (const k of Object.keys(tabs)) {
    const t = document.getElementById("tab-" + k);
    t.setAttribute("aria-selected", k === name); t.tabIndex = k === name ? 0 : -1;
    document.getElementById("view-" + k).hidden = k !== name;
  }
  if (focus) document.getElementById("tab-" + name).focus();
  const view = document.getElementById("view-" + name);
  if (loaded[name] && name === "new") return;
  loaded[name] = true;
  try { await tabs[name](view); } catch (e) { view.replaceChildren(message("err", e.message)); }
}
const order = Object.keys(tabs);
for (const k of order) {
  const t = document.getElementById("tab-" + k);
  t.addEventListener("click", () => show(k));
  t.addEventListener("keydown", e => {
    const i = order.indexOf(k);
    const to = e.key === "ArrowRight" ? order[(i + 1) % order.length] : e.key === "ArrowLeft" ? order[(i + order.length - 1) % order.length]
      : e.key === "Home" ? order[0] : e.key === "End" ? order[order.length - 1] : null;
    if (to) { e.preventDefault(); show(to, true); }
  });
}
document.getElementById("quit").addEventListener("click", async () => {
  try { await api("/api/quit", {}); } catch (e) { /* the server is gone */ }
  document.body.replaceChildren(h("main", {}, h("p", {}, "Stopped. You can close this tab.")));
});
show("new");
</script>
